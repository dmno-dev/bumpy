# simple workflow that runs after a release is published
# used only to verify "release workflow -> further actions" is working

name: On Release

on:
  release:
    types: [published]

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Release event triggered successfully!"
      # Pass event data via env rather than interpolating `${{ }}` into the script body,
      # so a crafted release name/tag can't inject shell.
      - env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          AUTHOR: ${{ github.event.release.author.login }}
        run: |
          echo "Release tag: $TAG_NAME"
          echo "Release name: $RELEASE_NAME"
          echo "Created by: $AUTHOR"
